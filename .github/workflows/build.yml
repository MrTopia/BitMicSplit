name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APKs
        run: ./gradlew assembleDebug

      - name: Upload QS tile APK
        uses: actions/upload-artifact@v4
        with:
          name: qs-tile-app-debug
          path: qs-tile-app/build/outputs/apk/debug/*.apk

      - name: Upload Xposed module APK
        uses: actions/upload-artifact@v4
        with:
          name: xposed-module-debug
          path: xposed-module/build/outputs/apk/debug/*.apk
