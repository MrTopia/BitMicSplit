plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lunaris.btmicsplit.xposed'
    compileSdk 34

    defaultConfig {
        applicationId "com.lunaris.btmicsplit.xposed"
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // LSPosed implements this API surface; compileOnly since it's provided
    // by the Xposed/LSPosed framework at runtime, not bundled in the APK.
    compileOnly 'de.robv.android.xposed:api:82'
}
